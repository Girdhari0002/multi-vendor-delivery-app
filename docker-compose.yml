services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ./server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/delivery_app
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      args:
        VITE_SERVER_API: http://localhost:5000/api
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mongo_data:
